<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חדר הניוזלטרים Seedbiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Seedbiz newsroom. Palette from the Seedbiz owl: charcoal body, violet-to-blue eyes. Layout: blue masthead with stacked English hero (echoing the site's
   "Israeli / Innovation / Ecosystem"), then an editorial front page: one lead story, two seconds, a ranked wire list; detail opens in a side drawer. */
:root{
  --blue:#0648d0;          /* owl eye, bottom */
  --violet:#a456ff;        /* owl eye, top */
  --grad:linear-gradient(160deg,#a456ff 0%,#5a4cf0 45%,#0648d0 100%);
  --char:#2b2b2b;          /* owl body charcoal */
  --char-2:#4d4d4d;
  --blue-deep:#262626;
  --blue-tint:#e2dff5;
  --mark:#c9a8ff;
  --ink:#24232c;
  --muted:#5f5e6b;
  --line:#d5d3df;
  --paper:#f3f2f6;
  --bg:#e4e3ea;
  --ok:#11a46b;
  --font-he:"Heebo",system-ui,sans-serif;
  --font-en:"Archivo","Heebo",system-ui,sans-serif;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --blue:#6d8dff; --violet:#b98aff; --blue-deep:#1a1a1f; --blue-tint:#262438; --mark:#7d5bd6; --char:#1c1c21; --char-2:#2e2e35;
    --ink:#f0eff6; --muted:#a8a7b8; --line:#2f2e3a; --paper:#18181e; --bg:#0f0f13; --ok:#3fd394;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --blue:#6d8dff; --violet:#b98aff; --blue-deep:#1a1a1f; --blue-tint:#262438; --mark:#7d5bd6; --char:#1c1c21; --char-2:#2e2e35;
  --ink:#f0eff6; --muted:#a8a7b8; --line:#2f2e3a; --paper:#18181e; --bg:#0f0f13; --ok:#3fd394;
  color-scheme:dark;
}
.themebtn{font:inherit;font-size:16px;line-height:1;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
.themebtn:hover{background:rgba(255,255,255,.12)}
.sig{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-he);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.en{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate}

/* ---------- masthead ---------- */
.mast{background:linear-gradient(90deg,var(--char) 0%,var(--char-2) 50%,var(--char) 100%);color:#fff;position:relative;overflow:hidden}
.mast::before{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--grad)}
.mast::after{content:"";position:absolute;inset-inline-start:-120px;bottom:-160px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(164,86,255,.28),rgba(6,72,208,0) 65%);pointer-events:none}
.mast-in{max-width:1080px;margin:0 auto;padding:16px 20px 0;position:relative;z-index:1}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wordmark{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.wordmark img{height:30px;width:auto;display:block}
.owlmark{position:absolute;inset-inline-start:-20px;top:50%;transform:translateY(-50%);width:min(440px,34vw);opacity:.07;pointer-events:none;z-index:0}
.owlmark.alt{inset-inline-start:auto;inset-inline-end:-20px}
@media (max-width:640px){.owlmark{display:none}}
.wordmark b{font-family:var(--font-en);font-weight:900;font-size:26px;letter-spacing:-.5px}
.wordmark b i{font-style:normal;color:var(--violet)}
.wordmark span{font-size:13px;font-weight:500;opacity:.8;letter-spacing:.3px}
.datebox{display:flex;align-items:center;gap:8px}
.datebox label{font-size:13px;opacity:.8}
.datebox select{font:inherit;font-size:14px;font-weight:700;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;background:transparent;color:#fff}
.datebox select option{color:#000}
.hero{display:grid;gap:16px;padding:30px 0 26px}
.stack{font-family:var(--font-en);font-weight:900;font-size:clamp(30px,5.4vw,60px);line-height:1;letter-spacing:-1.2px;direction:ltr;text-align:right;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack span{display:inline}
.stack span+span{margin-left:.28em}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.16);padding-top:16px}
.stack span:nth-child(2){background:linear-gradient(90deg,#a456ff,#4f7dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-he{flex:1 1 420px;min-width:0}
.hero-he .day{font-size:14px;opacity:.75;letter-spacing:.2px}
.hero-he .big{font-size:clamp(19px,2.2vw,24px);font-weight:700;line-height:1.35;margin-top:2px}
.kpis{display:flex;gap:28px;flex:0 0 auto}
.kpi{text-align:center}
.kpi b{display:block;font-family:var(--font-en);font-size:26px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;opacity:.8}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;flex-wrap:wrap}
nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.28);white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--grad);color:#fff;border-color:transparent}

/* ---------- page ---------- */
main{max-width:1080px;margin:0 auto;padding:24px 20px 70px;display:grid;gap:26px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:800}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:1.2px;color:var(--blue);text-transform:uppercase}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:8px}
.sec-h h2{font-size:24px}
.sec-h .sub{font-size:14px;color:var(--muted)}
.banner{border-radius:14px;padding:12px 16px;font-size:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--blue-tint);color:var(--ink);border:1px solid var(--line)}
.banner.bad{border-color:#e7a3a3;background:#fff1f1;color:#7a1515}
.banner button{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:7px 16px;font-weight:700}

/* must-know strip */
.must{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.must button{all:unset;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;align-content:start;transition:transform .15s, box-shadow .15s}
.must button:hover{transform:translateY(-2px);box-shadow:0 12px 28px -14px rgba(90,76,240,.5)}
.must button:focus-visible{outline:3px solid var(--blue)}
.must .n{font-family:var(--font-en);font-weight:900;font-size:34px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;justify-self:start}
.must h3{font-size:17.5px;line-height:1.35}
.must h3 mark{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--mark) 55%,transparent) 62%);color:inherit;padding:0 2px}
.must p{margin:0;font-size:15px;color:var(--muted)}

/* front page */
.front{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.lead{background:linear-gradient(135deg,var(--char) 0%,var(--char-2) 100%);color:#fff;border-radius:var(--r);padding:24px;display:grid;gap:12px;align-content:start;position:relative;overflow:hidden;cursor:pointer}
.lead::before{content:"";position:absolute;inset-inline-end:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:var(--grad);opacity:.55}
.lead::after{content:"";position:absolute;inset-inline-end:34px;top:34px;width:22px;height:22px;border-radius:50%;background:#fff;opacity:.95}
.lead h3{font-size:clamp(22px,3vw,30px);line-height:1.2}
.lead p{margin:0;opacity:.9}
.lead .seed{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;font-size:15.5px}
.lead .seed b{color:#c9a8ff}
.seconds{display:grid;gap:16px}
.story{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:8px;align-content:start;cursor:pointer;transition:border-color .15s}
.story:hover{border-color:var(--blue)}
.story h3{font-size:19px;line-height:1.3}
.story p{margin:0;color:var(--muted);font-size:15.5px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.lead .meta{color:rgba(255,255,255,.8)}
.src{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.mono{width:22px;height:22px;border-radius:7px;display:inline-grid;place-items:center;font-family:var(--font-en);font-size:11px;font-weight:900;color:#fff;background:var(--grad);direction:ltr}

.sig{display:inline-flex;gap:2px;align-items:end;height:14px}
.sig i{width:4px;border-radius:2px;background:currentColor;opacity:.25}
.sig i.on{opacity:1}
.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:7px}.sig i:nth-child(3){height:9px}.sig i:nth-child(4){height:11px}.sig i:nth-child(5){height:14px}
.uses{display:flex;gap:6px;flex-wrap:wrap}
.use{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--blue-tint);color:var(--blue)}
.lead .use{background:rgba(255,255,255,.14);color:#fff}
.go{font-weight:800;font-size:14.5px;color:var(--blue)}
.lead .go{color:#c9a8ff}

/* wire list */
.wire{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-bottom:0;width:100%;text-align:start}
.row:first-child{border-top:0}
.row:hover{background:var(--blue-tint)}
.row .rank{font-family:var(--font-en);font-weight:900;font-size:20px;color:var(--line);text-align:center}
.row h4{margin:0;font-size:16.5px;font-weight:700;line-height:1.35}
.row .t{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.row .arrow{color:var(--blue);font-weight:900}
.topicchip{font-size:12px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 9px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,7,40,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(620px,100%);background:var(--paper);z-index:21;transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,40,.25)}
[dir=rtl] .drawer{inset-inline-start:auto;inset-inline-end:0;left:0;right:auto;transform:translateX(-105%)}
.drawer.on{transform:none}
.dr-top{background:linear-gradient(90deg,var(--char),var(--char-2));border-bottom:4px solid;border-image:var(--grad) 1;color:#fff;padding:18px 22px;display:grid;gap:8px}
.dr-top .meta{color:rgba(255,255,255,.85)}

.dr-top h2{font-size:24px;line-height:1.25}
.dr-close{justify-self:start;background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:5px 14px;font-weight:700;font-size:14px}
.dr-body{overflow-y:auto;padding:20px 22px 30px;display:grid;gap:16px;align-content:start}
.dr-body p{margin:0}
.lede{font-size:18px;font-weight:500}
.callout{border-inline-start:5px solid var(--violet);background:var(--blue-tint);border-radius:12px;padding:12px 14px}
.callout b{color:var(--blue)}
.dr-sec h4{margin:0 0 6px;font-size:13px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.links{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14.5px;text-decoration:none;border:1.5px solid var(--blue);color:var(--blue);background:transparent}
.btn:hover{background:var(--blue-tint)}
.btn.solid{background:var(--grad);border-color:transparent;color:#fff}
.btn.solid:hover{filter:brightness(1.08)}
.btn[aria-pressed="true"]{background:var(--blue-tint);border-color:var(--violet);color:var(--violet)}
.btn:disabled{opacity:.5;cursor:default}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 10px}
.deep{background:var(--bg);border-radius:14px;padding:14px 16px;font-size:16px}
.deep h4,.answer h4{margin:10px 0 4px;font-size:16px}
.deep ul,.answer ul{margin:4px 0;padding-inline-start:20px}
.copybox{width:100%;min-height:130px;font:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);padding:10px;background:var(--paper);color:var(--ink)}

/* archive */
.searchbar{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.searchbar input{width:100%;font:inherit;font-size:18px;font-weight:500;padding:12px 16px;border-radius:999px;border:2px solid var(--blue);background:var(--paper);color:var(--ink)}
.facets{display:flex;gap:8px;flex-wrap:wrap}
.facet{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:600}
.facet[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
.facetrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.facetrow .lbl{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.8px;min-width:58px}
.count{font-size:14px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:36px 10px}

/* ask */
.askbox{background:linear-gradient(135deg,var(--char),var(--char-2));border-top:4px solid;border-image:var(--grad) 1;color:#fff;border-radius:var(--r);padding:22px;display:grid;gap:14px}
.askbox h2{font-size:26px}
.askbox textarea{width:100%;min-height:96px;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:0;background:var(--paper);color:var(--ink);resize:vertical}
.sugg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sugg button{all:unset;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.4}
.sugg button:hover{background:rgba(255,255,255,.16)}
.sugg button:focus-visible{outline:3px solid var(--mark)}
.askrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.askrow .btn{border-color:transparent;background:var(--grad);color:#fff}
.askstate{font-size:14px;opacity:.85}
.answer{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;font-size:16.5px}
.answer:empty{display:none}
.cite{font-size:12px;font-weight:800;text-decoration:none;background:var(--blue-tint);border-radius:6px;padding:0 5px;margin-inline:2px}
.srcs{display:grid;gap:6px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:12px}

/* trends */
.tgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;align-content:start}
.panel h3{font-size:18px}
.hbar{display:grid;grid-template-columns:130px 1fr 54px;gap:10px;align-items:center;font-size:14.5px}
.hbar .tr{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.hbar .fl{height:100%;background:linear-gradient(270deg,#a456ff,#0648d0);border-radius:7px}
.hbar .v{font-family:var(--font-en);font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);direction:ltr;text-align:right}
.cloud{display:flex;flex-wrap:wrap;gap:8px}
.cloud a{text-decoration:none;color:var(--blue);background:var(--blue-tint);border-radius:999px;padding:3px 12px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:start;padding:9px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:12.5px;letter-spacing:.5px}
td.n{font-family:var(--font-en);font-weight:700;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.drop{font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--blue-tint);color:var(--violet)}

.skeleton{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--paper),var(--bg),var(--paper));background-size:200% 100%;animation:sh 1.4s infinite;border:1px solid var(--line)}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.on{opacity:1}
footer{max-width:1080px;margin:0 auto;padding:0 20px 34px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

@media (max-width:820px){
  .front,.tgrid{grid-template-columns:1fr}
  .must{grid-template-columns:1fr}
  .stack{white-space:normal}
  .sugg{grid-template-columns:1fr}
}
@media (max-width:480px){
  .row{grid-template-columns:30px 1fr;padding:12px 14px}
  .row .arrow{display:none}
  .hbar{grid-template-columns:96px 1fr 40px}
  .wordmark span{display:none}
}
</style>
<script>
(function(){var r=document.documentElement,k="sbz-theme";
try{var t=localStorage.getItem(k);if(t)r.setAttribute("data-theme",t)}catch(e){}
function isDark(){var t=r.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function lbl(){var b=document.getElementById("themebtn");if(b){b.textContent=isDark()?"☀":"◐";b.setAttribute("aria-label",isDark()?"מצב בהיר":"מצב כהה")}}
document.addEventListener("DOMContentLoaded",function(){lbl();document.getElementById("themebtn").addEventListener("click",function(){var n=isDark()?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem(k,n)}catch(e){}lbl()})});
})();
</script>
</head>

<main>

</main>
<footer><span>Seedbiz · התקציר היומי מתעדכן כל בוקר</span><span><span id="fresh"></span></span></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle" hidden></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const COLS=["date","digestDate","source","topic","title","summary","relevance","tags","importance","mailLink","threadId","notes","expansion","articleLink","use"];
let items=[],dates=[],currentDate=null,loaded=false,mcp=null,sample=null,lastQ="",insights={};
let starred=(()=>{try{return new Set(JSON.parse(localStorage.getItem("sb_stars")||"[]"))}catch(e){return new Set()}})();
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const saveStars=()=>{try{localStorage.setItem("sb_stars",JSON.stringify([...starred]))}catch(e){}};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2200)};
const MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"],DAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const fmtDate=d=>{if(!d)return"";const[y,m,dd]=d.split("-");const dt=new Date(+y,+m-1,+dd);return `יום ${DAYS[dt.getDay()]} · ${+dd} ב${MONTHS[+m-1]} ${y}`};
const short=d=>(d||"").split("-").reverse().join(".");
const splitSrc=s=>s.split(/\s\+\s|\s\/\s/).map(x=>x.trim()).filter(Boolean);
const mono=s=>{const w=s.replace(/^The\s+/i,"").split(/[\s(]+/).filter(Boolean);return esc(((w[0]||"?")[0]+((w[1]||"")[0]||"")).toUpperCase())};
const sig=n=>`<span class="sig" aria-label="חשיבות ${n} מתוך 5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;
const uses=it=>it.use?`<div class="uses">${it.use.split(",").map(s=>s.trim()).filter(Boolean).map(u=>`<span class="use">${esc(u)}</span>`).join("")}</div>`:"";
const srcLine=it=>`<span class="src"><span class="mono">${mono(splitSrc(it.source)[0]||"?")}</span>${esc(it.source)}</span>`;

/* ---------- data ---------- */
function findValues(p){if(!p)return null;if(Array.isArray(p)&&Array.isArray(p[0]))return p;if(typeof p==="string"){try{return findValues(JSON.parse(p))}catch(e){return null}}if(typeof p==="object"){if(Array.isArray(p.values))return p.values;for(const k of Object.keys(p)){const v=findValues(p[k]);if(v)return v}}return null}
function ingest(res){
  const vals=findValues(res&&(res.payload!==undefined?res.payload:res));
  if(!vals){showStatus("bad","המאגר נקרא, אבל לא נמצאו בו שורות. בדוק שהגיליון 'פריטים' קיים.");return}
  items=vals.slice(1).filter(r=>r&&r[4]).map((r,i)=>{const o={};COLS.forEach((c,j)=>o[c]=r[j]==null?"":String(r[j]).trim());o.importance=Math.min(5,Math.max(1,parseInt(o.importance,10)||1));o.idx=i;o.key=(o.threadId||"")+"|"+o.title;return o});
  dates=[...new Set(items.map(i=>i.digestDate).filter(Boolean))].sort().reverse();
  if(!currentDate||!dates.includes(currentDate))currentDate=dates[0]||null;
  loaded=true;
  $("#datesel").innerHTML=dates.map(d=>`<option value="${d}">${short(d)}</option>`).join("");
  const st=res&&res.updated;
  $("#fresh").textContent="עודכן "+new Date(st||Date.now()).toLocaleString("he-IL",{dateStyle:"short",timeStyle:"short"})+` · ${items.length} פריטים`;
  render();
}
function ingestInsights(res){
  const vals=findValues(res&&(res.payload!==undefined?res.payload:res));
  insights={};
  if(vals)vals.slice(1).filter(r=>r&&r[0]&&r[2]).forEach(r=>{(insights[String(r[0]).trim()]=insights[String(r[0]).trim()]||[]).push({n:+r[1]||0,head:String(r[2]||"").trim(),text:String(r[3]||"").trim(),link:String(r[4]||"").trim()})});
  Object.values(insights).forEach(a=>a.sort((x,y)=>x.n-y.n));
  if(loaded)render();
}
function showStatus(kind,msg,btn){const el=$("#status");if(!kind){el.innerHTML="";return}el.innerHTML=`<div class="banner ${kind==="bad"?"bad":""}"><span>${msg}</span>${btn?`<button id="stb">${btn.label}</button>`:""}</div>`;if(btn)$("#stb").addEventListener("click",btn.fn)}
/* ---------- routing ---------- */
function route(){const h=(location.hash||"").slice(1);if(h.startsWith("d-")){currentDate=h.slice(2);return"today"}return["today","archive","trends"].includes(h)?h:"today"}
window.addEventListener("hashchange",render);

function hero(){
  const day=items.filter(i=>i.digestDate===currentDate);
  $("#heroDay").textContent=currentDate?fmtDate(currentDate):"";
  const top=[...day].sort((a,b)=>b.importance-a.importance)[0];
  $("#heroBig").textContent=top?top.title:"מה שקרה בעולם הסטארטאפים, ההון וה-AI, מסונן בשביל העבודה שלך.";
  const srcs=new Set(day.flatMap(i=>splitSrc(i.source)));
  const mins=Math.max(3,Math.round(day.reduce((s,i)=>s+i.summary.length+i.expansion.length,0)/900));
  $("#kpis").innerHTML=day.length?`<div class="kpi"><b>${day.length}</b><span>פריטים</span></div><div class="kpi"><b>${srcs.size}</b><span>מקורות</span></div><div class="kpi"><b>${mins}′</b><span>קריאה מלאה</span></div>`:"";
  if(currentDate&&$("#datesel").value!==currentDate)$("#datesel").value=currentDate;
}

function render(){
  const v=route();
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.view===v?"page":"false"));
  const box=$("#view");
  if(loaded)hero();
  if(!loaded){box.innerHTML=`<div style="display:grid;gap:14px"><div class="skeleton"></div><div class="skeleton" style="height:220px"></div><div class="skeleton"></div></div>`;return}
  if(v==="today")box.innerHTML=todayView();
  if(v==="archive"){box.innerHTML=archiveView();bindArchive()}
  if(v==="trends"){box.innerHTML=trendsView();bindTrends()}
  bindOpeners(box);
}

/* ---------- today ---------- */
function todayView(){
  const day=items.filter(i=>i.digestDate===currentDate).sort((a,b)=>b.importance-a.importance);
  if(!day.length)return`<div class="empty">אין פריטים לתאריך הזה.</div>`;
  const [lead,...rest]=day, seconds=rest.slice(0,2), wire=rest.slice(2);
  const ins=(insights[currentDate]||[]).slice(0,3);
  const clip=(t,n)=>{t=t||"";return t.length>n?t.slice(0,n).replace(/\s+\S*$/,"")+"…":t};
  const must=ins.length?ins.map(x=>{const it=day.find(i=>i.title===x.link)||day.find(i=>x.link&&i.title.includes(x.link.slice(0,20)));return{head:x.head,text:x.text,idx:it?it.idx:null}})
    :(day.length>3?day.slice(3,6):day.slice(0,3)).map(i=>({head:clip(i.title,60),text:clip(i.relevance||i.summary,110),idx:i.idx}));
  return `
  <section aria-label="3 דברים שחייבים לדעת" style="display:grid;gap:12px">
    <div class="sec-h"><h2>3 דברים שחייבים לדעת</h2><span class="sub">התמצית של היום, בחצי דקה</span></div>
    <div class="must">${must.map((m,n)=>`<button ${m.idx!=null?`data-open="${m.idx}"`:""}><span class="n en">0${n+1}</span><h3><mark>${esc(m.head)}</mark></h3><p>${esc(m.text)}</p></button>`).join("")}</div>
  </section>
  <section style="display:grid;gap:12px">
    <div class="sec-h"><h2>הסיפורים המרכזיים</h2><span class="sub">${esc(fmtDate(currentDate))}</span></div>
    <div class="front">
      <article class="lead" data-open="${lead.idx}" tabindex="0" role="button" aria-label="פתח: ${esc(lead.title)}">
        <div class="meta">${srcLine(lead)} ${sig(lead.importance)} <span>${esc(lead.topic)}</span></div>
        <h3>${esc(lead.title)}</h3>
        <p>${esc(lead.summary)}</p>
        ${lead.relevance?`<div class="seed"><b>לסידביז:</b> ${esc(lead.relevance)}</div>`:""}
        ${uses(lead)}
        <span class="go">לקריאה המלאה ←</span>
      </article>
      <div class="seconds">${seconds.map(i=>`<article class="story" data-open="${i.idx}" tabindex="0" role="button" aria-label="פתח: ${esc(i.title)}">
        <div class="meta">${srcLine(i)} ${sig(i.importance)}</div>
        <h3>${esc(i.title)}</h3><p>${esc(i.summary)}</p>${uses(i)}<span class="go">לקריאה המלאה ←</span></article>`).join("")}</div>
    </div>
  </section>
  ${wire.length?`<section style="display:grid;gap:12px">
    <div class="sec-h"><h2>עוד מהיום</h2><span class="sub">${wire.length} פריטים, מהחשוב לפחות חשוב</span></div>
    <div class="wire">${wire.map((i,n)=>row(i,n+4)).join("")}</div>
  </section>`:""}`;
}
function row(i,rank,showDate){
  return `<button class="row" data-open="${i.idx}"><span class="rank en">${rank!=null?String(rank).padStart(2,"0"):"·"}</span>
  <span><h4>${esc(i.title)}</h4><span class="t">${srcLine(i)}<span class="topicchip">${esc(i.topic)}</span>${sig(i.importance)}${showDate?`<span>${short(i.digestDate)}</span>`:""}${starred.has(i.key)?"<span>★</span>":""}</span></span>
  <span class="arrow">←</span></button>`;
}

/* ---------- drawer ---------- */
let drawerItem=null,lastFocus=null;
function bindOpeners(root){
  root.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click",()=>openDrawer(+el.dataset.open));
    if(el.tagName!=="BUTTON")el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openDrawer(+el.dataset.open)}});
  });
  root.querySelectorAll("[data-goto]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();openDrawer(+a.dataset.goto)}));
}
function openDrawer(idx){
  const it=items.find(i=>i.idx===idx);if(!it)return;drawerItem=it;lastFocus=document.activeElement;
  const d=$("#drawer"),st=starred.has(it.key);
  d.innerHTML=`<div class="dr-top">
      <button class="dr-close" id="drClose">סגור ✕</button>
      <div class="meta">${srcLine(it)} ${sig(it.importance)} <span>${esc(it.topic)}</span> <span>${short(it.date)}</span></div>
      <h2 id="drTitle">${esc(it.title)}</h2>
    </div>
    <div class="dr-body">
      <p class="lede">${esc(it.summary)}</p>
      ${it.relevance?`<div class="callout"><b>מה זה אומר לסידביז:</b> ${esc(it.relevance)}</div>`:""}
      <div class="dr-sec"><h4>הסיפור המלא</h4>${it.expansion?`<p>${esc(it.expansion)}</p>`:`<p style="color:var(--muted)">אין הרחבה לפריט הזה.</p>`}</div>
      ${uses(it)}
      ${it.tags?`<div class="tags">${it.tags.split(",").map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag"><bdi>#${esc(t)}</bdi></span>`).join("")}</div>`:""}
      ${it.articleLink?`<div class="dr-sec"><h4>להמשך קריאה</h4><div class="links">
        <a class="btn solid" href="${esc(it.articleLink)}" target="_blank" rel="noopener">לכתבה המקורית ↗</a>
      </div></div>`:""}
      <div class="deep" id="drOut" hidden></div>
    </div>`;
  d.hidden=false;requestAnimationFrame(()=>{d.classList.add("on");$("#scrim").classList.add("on")});
  $("#drClose").addEventListener("click",closeDrawer);
  if(0)$("#drStar").addEventListener("click",e=>{const b=e.currentTarget;if(starred.has(it.key))starred.delete(it.key);else starred.add(it.key);saveStars();const s=starred.has(it.key);b.setAttribute("aria-pressed",s);b.textContent=s?"★ שמור":"☆ שמור לאחר כך";toast(s?"נשמר":"הוסר מהשמורים")});
  $("#drClose").focus();
}
function closeDrawer(){const d=$("#drawer");d.classList.remove("on");$("#scrim").classList.remove("on");setTimeout(()=>{d.hidden=true},280);drawerItem=null;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$("#scrim").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&drawerItem)closeDrawer()});

async function copySlide(it){
  const pts=(it.expansion||it.summary).split(/(?<=[.!?])\s+/).filter(s=>s.length>20).slice(0,3);
  const txt=`${it.title}\n\n${pts.map(p=>"• "+p).join("\n")}\n\nמקור: ${it.source}${it.articleLink?" – "+it.articleLink:""}`;
  try{await navigator.clipboard.writeText(txt);toast("הטקסט לשקף הועתק")}
  catch(e){const o=$("#drOut");o.hidden=false;o.innerHTML=`<p style="color:var(--muted);margin:0 0 6px">ההעתקה האוטומטית חסומה כאן. סמן והעתק:</p><textarea class="copybox" readonly>${esc(txt)}</textarea>`;o.querySelector("textarea").select()}
}
/* ---------- archive ---------- */
let arch={q:"",topic:"",use:"",min:1,star:false};
function archiveView(){
  const topics=[...new Set(items.map(i=>i.topic).filter(Boolean))].sort();
  const usesAll=[...new Set(items.flatMap(i=>i.use.split(",")).map(s=>s.trim()).filter(Boolean))].sort();
  const f=(k,v,l)=>`<button class="facet" data-k="${k}" data-v="${esc(v)}" aria-pressed="${String(arch[k])===String(v)}">${esc(l)}</button>`;
  return `<div class="sec-h"><h2>ארכיון וחיפוש</h2><span class="sub">כל הפריטים מכל התקצירים</span></div>
  <div class="searchbar">
    <input type="search" id="q" placeholder="חפש: Series A, קרדיטים, תמחור, Nvidia…" value="${esc(arch.q)}" aria-label="חיפוש במאגר">
    <div class="facetrow"><span class="lbl">נושא</span><div class="facets">${f("topic","","הכול")}${topics.map(t=>f("topic",t,t)).join("")}</div></div>
  </div>
  <div class="count" id="acount"></div>
  <div class="wire" id="alist"></div>`;
}
function bindArchive(){
  const upd=()=>{
    const w=arch.q.toLowerCase().split(/\s+/).filter(Boolean);
    const res=items.filter(i=>(!arch.topic||i.topic===arch.topic)&&(!arch.use||i.use.includes(arch.use))&&i.importance>=arch.min&&(!arch.star||starred.has(i.key))&&w.every(x=>(i.title+" "+i.summary+" "+i.expansion+" "+i.tags+" "+i.source+" "+i.relevance).toLowerCase().includes(x)))
      .sort((a,b)=>(b.digestDate||"").localeCompare(a.digestDate||"")||b.importance-a.importance);
    $("#acount").textContent=`${res.length} פריטים`;
    const L=$("#alist");
    L.innerHTML=res.length?res.map(i=>row(i,null,true)).join(""):`<div class="empty">לא נמצאו פריטים. נסה מילה אחרת או הסר סינון.</div>`;
    bindOpeners(L);
  };
  $("#q").addEventListener("input",e=>{arch.q=e.target.value;upd()});
  document.querySelectorAll(".facet[data-k]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.k;arch[k]=k==="min"?+b.dataset.v:b.dataset.v;document.querySelectorAll(`.facet[data-k="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b));upd()}));
  upd();
}

/* ---------- trends ---------- */
function trendsView(){
  const ds=[...dates].sort(),last=ds[ds.length-1],D=86400000,T=d=>new Date(d+"T00:00:00").getTime(),lt=T(last);
  const rec=items.filter(i=>lt-T(i.digestDate)<7*D),prev=items.filter(i=>{const x=lt-T(i.digestDate);return x>=7*D&&x<14*D});
  const tops=[...new Set(items.map(i=>i.topic||"שונות"))].map(t=>({t,now:rec.filter(i=>i.topic===t).length,was:prev.filter(i=>i.topic===t).length,w:rec.filter(i=>i.topic===t).reduce((s,i)=>s+i.importance,0)})).filter(r=>r.now||r.was).sort((a,b)=>b.w-a.w);
  const mx=Math.max(1,...tops.map(r=>r.w));
  const tc={};rec.forEach(i=>i.tags.split(",").map(s=>s.trim()).filter(Boolean).forEach(t=>tc[t]=(tc[t]||0)+1));
  const tags=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,16);
  const sm={};items.forEach(i=>splitSrc(i.source).forEach(s=>(sm[s]=sm[s]||[]).push(i.importance)));
  const srcs=Object.entries(sm).map(([s,a])=>({s,n:a.length,avg:a.reduce((x,y)=>x+y,0)/a.length,hi:a.filter(x=>x>=4).length})).sort((a,b)=>b.avg-a.avg);
  return `<div class="sec-h"><h2>מגמות</h2><span class="sub">7 הימים האחרונים במאגר</span></div>
  <div class="tgrid">
    <section class="panel"><span class="eyebrow">Signal by topic</span><h3>על מה מדברים השבוע</h3>
      <p style="margin:0;color:var(--muted);font-size:14px">אורך הפס מבטא את משקל הנושא השבוע. המספר הוא כמות הפריטים${prev.length?", והחץ מראה שינוי מול השבוע הקודם":""}.</p>
      ${tops.map(r=>{const d=r.now-r.was;return `<div class="hbar"><span>${esc(r.t)}</span><span class="tr"><span class="fl" style="display:block;width:${r.w/mx*100}%"></span></span><span class="v">${prev.length?(d>0?"▲":d<0?"▼":"·"):""} ${r.now}</span></div>`}).join("")||`<div class="empty">אין עדיין מספיק נתונים.</div>`}
      ${prev.length?"":`<p style="margin:0;color:var(--muted);font-size:13px">ההשוואה לשבוע הקודם תופיע אחרי שבוע של תקצירים.</p>`}
    </section>
    <section class="panel"><span class="eyebrow">Hot tags</span><h3>תגיות חמות</h3>
      <div class="cloud">${tags.map(([t,n])=>`<a href="#archive" data-tag="${esc(t)}"><bdi>#${esc(t)}</bdi> <span class="en">${n}</span></a>`).join("")}</div>
    </section>
  </div>
`;
}
function bindTrends(){document.querySelectorAll("[data-tag]").forEach(a=>a.addEventListener("click",()=>{arch={q:a.dataset.tag,topic:"",use:"",min:1,star:false}}))}

/* ---------- boot ---------- */
$("#datesel").addEventListener("change",e=>{currentDate=e.target.value;try{history.replaceState(null,"","#d-"+currentDate)}catch(_){}render();window.scrollTo(0,0)});
render();
(async()=>{
  try{
    const idx=await (await fetch("index.json",{cache:"no-store"})).json();
    const days=await Promise.all((idx.days||[]).map(d=>fetch("days/"+d+".json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)));
    const rows=[COLS];const ins=[["d","n","h","t","l"]];
    days.filter(Boolean).forEach(day=>{
      (day.items||[]).forEach(r=>rows.push([r[0],day.date,r[1],r[2],r[3],r[4],r[5]||"",r[6],r[7],"","","",r[8],r[9],r[10]||""]));
      (day.insights||[]).forEach(x=>ins.push([day.date,x[0],x[1],x[2],x[3]]));
    });
    ingestInsights({values:ins});
    ingest({values:rows,updated:idx.updated});
  }catch(e){showStatus("warn","לא הצלחתי לטעון את התקצירים. נסה לרענן את העמוד.")}
})();
})();
</script>
